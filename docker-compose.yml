version: '3.8'

services:
  go-server:
    build: .
    container_name: http-server-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8000/api/public/status"]
      interval: 30s
      timeout: 5s
      retries: 3